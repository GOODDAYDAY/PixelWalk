<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f4ee"><title>PixelWalk</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><a class="brand" href="#/"><img src="assets/logo.svg" width="192" height="48" alt="PixelWalk 首页"></a><nav><div class="utilities"><button id="immersive-button" aria-pressed="false" title="Esc 或双击画面退出沉浸模式">◫ <span>沉浸</span></button><button id="sound-button" title="日夜配乐 · Scott Buckley · CC BY 4.0" aria-pressed="false">♫ <span>BGM 关</span></button><button id="music-info-button" aria-label="音乐署名">ⓘ</button><button id="restart-button" aria-label="重新出发" title="重新出发">↺</button><button id="fullscreen-button" aria-label="全屏游戏">⛶</button></div><a class="contribute-link" href="#/contribute"><span>＋</span> 参与设计</a></nav></header>
<main id="play-page" class="page">
<section class="game-shell" aria-label="像素漫游游戏">
<div class="canvas-wrap">
<canvas id="game" width="960" height="540" tabindex="0" aria-label="漫游画面；D 或右方向键前进，A 或左方向键返回，木屋门前按 W 进入"></canvas>
<button id="enter-house" class="door-prompt" hidden><kbd>W</kbd> 进入</button>
<div class="game-bottom"><div class="art-caption" id="art-caption" hidden><strong id="art-title"></strong><small id="art-author"></small></div></div>
<div id="toast" class="toast" role="status"></div>
<dialog id="credits-dialog" aria-labelledby="credits-title">
<section class="scroll-sheet">
<div class="scroll-rod top-rod"></div>
<button id="close-credits" class="close" aria-label="收起画卷">×</button>
<div class="credits-heading"><p>作者</p><h1 id="credits-title">Lin</h1><div class="seal" aria-hidden="true">林</div></div>
<div class="thanks-heading"><h2>鸣谢</h2><small id="thanks-count">0 位参与者</small></div>
<label class="search-box"><span aria-hidden="true">⌕</span><input id="thanks-search" type="search" placeholder="搜索参与者" aria-label="搜索鸣谢名单" autocomplete="off"></label>
<div id="thanks-scroll" class="thanks-scroll" tabindex="0" aria-label="鸣谢名单，可向下滚动"><ul id="thanks-list"></ul><p id="thanks-empty" class="thanks-empty">还没有参与者，期待第一处风景。</p></div>
<div class="scroll-music">音乐：Scott Buckley · <a href="https://www.scottbuckley.com.au/library/childhood/" target="_blank" rel="noopener">Childhood</a> / <a href="https://www.scottbuckley.com.au/library/moonlight/" target="_blank" rel="noopener">Moonlight</a><br><a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · <a href="https://www.scottbuckley.com.au" target="_blank" rel="noopener">www.scottbuckley.com.au</a></div>
<div class="scroll-rod bottom-rod"></div>
</section></dialog>
</div></section>
</main>
<main id="contribute-page" class="page secondary" hidden>
<div class="studio">
<a class="back px-link" href="#/">◀ 原野</a>
<section class="pad" aria-label="风景控板">
<label id="drop-zone" class="slot px"><input type="file" id="image-file" accept="image/png,image/webp"><canvas id="pixel-result" width="160" height="160" hidden></canvas><span id="slot-empty"><b>＋</b>透明 PNG</span></label>
<button id="sample-button" class="px-link" type="button">用示例小猫</button>
<input id="art-name" class="px px-input" maxlength="40" placeholder="名字" aria-label="作品名称">
<div class="px-group" role="group" aria-label="时段"><button data-phase="day" class="px-key selected" aria-pressed="true">☀</button><button data-phase="night" class="px-key" aria-pressed="false">☾</button></div>
<div class="px-group" role="group" aria-label="体积"><button data-size="small" class="px-key" aria-pressed="false">S</button><button data-size="medium" class="px-key selected" aria-pressed="true">M</button><button data-size="large" class="px-key" aria-pressed="false">L</button><button data-size="giant" class="px-key" aria-pressed="false">XL</button></div>
<div class="px-group" role="group" aria-label="摆放"><button data-air="false" class="px-key selected" aria-pressed="true">地面</button><button data-air="true" class="px-key" aria-pressed="false">空中</button></div>
<p id="process-status" class="status" role="status"></p>
</section>
<section class="stage">
<div class="preview-world px-frame"><canvas id="preview-game" width="960" height="540" tabindex="0" aria-label="试玩画面，D 或右方向键前进，A 或左方向键后退"></canvas></div>
<div class="stage-bar">
<div class="px-group dpad"><button id="preview-back" class="px-key" aria-label="后退">◀</button><button id="preview-walk" class="px-key" aria-label="前进">▶</button><button id="preview-reset" class="px-key" aria-label="重走">↺</button></div>
<div class="px-group"><button id="download-submission" class="px-key" disabled>PNG ↓</button><a id="submit-issue" class="px-key primary-key" aria-disabled="true" href="https://github.com/JilinJL/PixelWalk/issues/new?template=scenery.yml" target="_blank" rel="noopener">投稿 ↗</a></div>
</div>
</section>
</div>
</main>
<dialog id="music-dialog" aria-labelledby="music-title"><button id="close-music" class="close" aria-label="关闭音乐信息">×</button><h2 id="music-title">音乐</h2><p>白天 · <a href="https://www.scottbuckley.com.au/library/childhood/" target="_blank" rel="noopener">Childhood</a><br>夜晚 · <a href="https://www.scottbuckley.com.au/library/moonlight/" target="_blank" rel="noopener">Moonlight</a></p><p>Music by Scott Buckley<br>Released under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a><br><a href="https://www.scottbuckley.com.au" target="_blank" rel="noopener">www.scottbuckley.com.au</a></p><label class="volume">音量 <input id="bgm-volume" type="range" min="0" max="30" step="1" value="10" aria-label="BGM 音量"><output id="bgm-volume-value">10%</output></label></dialog>
<audio id="bgm-day" src="assets/audio/childhood.m4a" preload="none" loop></audio>
<audio id="bgm-night" src="assets/audio/moonlight.m4a" preload="none" loop></audio>
<script src="content.js"></script><script src="music.js"></script>
<script src="engine.js"></script><script src="pixelate.js"></script><script src="library.js"></script><script src="app.js"></script>
</body></html>
