name: 风景投稿
description: 投稿一张在 PixelWalk 生成的像素风景。
title: "[风景投稿] "
labels: [scenery, pending-review]
body:
  - type: markdown
    attributes:
      value: |
        把下载的 PNG 拖入下方；图片不会自动上传。署名为你的 GitHub 账号。
        投稿前阅读[图文贡献指南](https://github.com/JilinJL/PixelWalk/blob/main/CONTRIBUTING.md)和[内容规范](https://github.com/JilinJL/PixelWalk/blob/main/docs/zh-CN/content-policy.md)。提交后需人工审核和部署，才会进入公开游戏。

        [English submission guide](https://github.com/JilinJL/PixelWalk/blob/main/CONTRIBUTING.en.md)
  - type: input
    id: work-title
    attributes:
      label: 作品名称
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: 像素 PNG
      description: 160×160 透明 PNG，只附一张。
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: 展示时段
      options: [日景, 夜景]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: 体积
      options: [小, 中, 大, 巨大]
    validations:
      required: true
  - type: input
    id: extent
    attributes:
      label: 巨大作品尺寸
      description: 仅巨大档使用，320–960；留空为 480。保持比例并自动适配画面。
      placeholder: "480"
  - type: dropdown
    id: placement
    attributes:
      label: 摆放方式
      options: [地面, 空中]
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 素材来源
      placeholder: 原创 / AI 辅助 / 第三方素材及许可
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      options:
        - label: 我有权公开此作品，并允许 PixelWalk 署名展示与分发。
          required: true
        - label: 我已阅读内容规范，确认作品、名称与来源不含禁止内容。
          required: true
