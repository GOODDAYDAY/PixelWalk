name: Scenery publish
# Every 30 minutes, release all approved scenery in one batch, deploy Pages,
# then label/close the issues. An empty queue does nothing.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: scenery-git
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      issues: ${{ steps.publish.outputs.issues }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: publish
        run: node scripts/scenery.cjs publish
      - id: commit
        if: steps.publish.outputs.changed == 'true'
        run: |
          npm test
          bash scripts/commit-scenery.sh "scenery - publish batch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here.
  deploy:
    needs: batch
    if: needs.batch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.batch.outputs.sha }}
  announce:
    needs: [batch, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/scenery.cjs announce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUES: ${{ needs.batch.outputs.issues }}
